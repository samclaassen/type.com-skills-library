  *{box-sizing:border-box}

  .content{flex:1;min-width:0}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}

  .grid{display:grid;gap:14px}
  .g2{grid-template-columns:1.4fr 1fr}

  @media(max-width:860px){.shell{flex-direction:column}.sidenav{width:100%;height:auto;position:static;border-right:none;border-bottom:1px solid var(--sb-border)}.sb-foot{margin-top:0}}

  .feed{list-style:none;padding:0;margin:0}
  .feed li{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-2)}

  .feed .when{font-size:12px;color:var(--ink-3);width:100px;flex:none;font-weight:500;padding-top:1px;font-variant-numeric:tabular-nums;white-space:nowrap}

  .search{flex:1;min-width:180px;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);

    background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);

  .sgroup{margin-bottom:20px}

  .sgroup-h .g-count{color:var(--ink-3);font-weight:500}

    box-shadow:var(--shadow);transition:border-color .12s ease,background .12s ease;position:relative}

  .scard-top{display:flex;gap:11px;align-items:flex-start}

  .scard .tt{color:var(--ink-3);font-size:12.5px;margin-top:1px;line-height:1.35}
  .meta-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
  .role-pill{font-size:11px;font-weight:550;padding:2px 8px;border-radius:999px;border:1px solid color-mix(in srgb,currentColor 30%,transparent)}
  .stars{color:var(--med);font-size:11.5px;letter-spacing:1px}

  .eng .edot{width:7px;height:7px;border-radius:50%}

  .prio-prev .plabel{font-size:11px;color:var(--ink-3);font-weight:550;margin-bottom:3px}
  .badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}

<script>

        if(lu){ var li=b.querySelector('.wsl'); li.src=lu;
          li.onerror=function(){ var dot=document.createElement('span'); dot.className='wsd'; dot.style.background=acc2; li.replaceWith(dot); }; }
        b.querySelector('.wsn').textContent = nm;
        b.onclick = function(){ mount(nm); };
        nav.appendChild(b);
      });
    }
    mountDossier(d);
    try{ window.scrollTo(0,0); }catch(e){}
  }
  window.__mountWorkspace = mount;
  function init(){

    mountEl = document.createElement('div'); mountEl.id='ai-mount'; document.body.appendChild(mountEl);
    mount(order[0]);
  }
  if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded', init); } else { init(); }

function mountDossier(DOSSIER){
  "use strict";

  // ---------- helpers ----------
  function el(tag,cls,html){var e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e;}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function initials(n){n=(n||'?').trim();var p=n.split(/\s+/);return ((p[0]||'')[0]||'?').toUpperCase()+((p[1]||'')[0]||'').toUpperCase();}
  function hashHue(s){var h=0;s=s||'';for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h%360;}
  function avatarStyle(name){return '';}

      av.classList.add('has-img'); av.appendChild(im);
    } else { av.textContent=initials(s.name); }
    return av;
  }
  function fmtMoney(v){if(v==null||v==='')return null;if(typeof v==='string')return v;var n=Number(v);if(!isFinite(n))return null;
    if(n>=1e9)return '$'+(n/1e9).toFixed(n%1e9?1:0)+'B';if(n>=1e6)return '$'+(n/1e6).toFixed(n%1e6?1:0)+'M';
    if(n>=1e3)return '$'+(n/1e3).toFixed(0)+'K';return '$'+n;}
  function pct(v){if(v==null||v==='')return null;var n=Number(v);if(!isFinite(n))return null;return (n>0?'+':'')+n+'%';}

  function roleBg(r){return 'var(--'+(ROLE_KEY[r]||'unk')+'-bg)';}
  function stars(n){n=Math.min(Math.max(n||0,0),5);return '★★★★★'.slice(0,n)+'☆☆☆☆☆'.slice(0,5-n);}
  var LICONS={"user": "<path d=\"M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2\"/><circle cx=\"12\" cy=\"7\" r=\"4\"/>", "trending-up": "<path d=\"M16 7h6v6\"/><path d=\"m22 7-8.5 8.5-5-5L2 17\"/>", "zap": "<path d=\"M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z\"/>", "banknote": "<rect width=\"20\" height=\"12\" x=\"2\" y=\"6\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/><path d=\"M6 12h.01M18 12h.01\"/>", "newspaper": "<path d=\"M15 18h-5\"/><path d=\"M18 14h-8\"/><path d=\"M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-4 0v-9a2 2 0 0 1 2-2h2\"/><rect width=\"8\" height=\"4\" x=\"10\" y=\"6\" rx=\"1\"/>", "file-text": "<path d=\"M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z\"/><path d=\"M14 2v5a1 1 0 0 0 1 1h5\"/><path d=\"M10 9H8\"/><path d=\"M16 13H8\"/><path d=\"M16 17H8\"/>", "route": "<circle cx=\"6\" cy=\"19\" r=\"3\"/><path d=\"M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15\"/><circle cx=\"18\" cy=\"5\" r=\"3\"/>", "triangle-alert": "<path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\"/><path d=\"M12 9v4\"/><path d=\"M12 17h.01\"/>", "mail": "<path d=\"m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7\"/><rect x=\"2\" y=\"4\" width=\"20\" height=\"16\" rx=\"2\"/>", "phone": "<path d=\"M13.832 16.568a1 1 0 0 0 1.213-.303l.355-.465A2 2 0 0 1 17 15h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2A18 18 0 0 1 2 4a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v3a2 2 0 0 1-.8 1.6l-.468.351a1 1 0 0 0-.292 1.233 14 14 0 0 0 6.392 6.384\"/>", "search": "<path d=\"m21 21-4.34-4.34\"/><circle cx=\"11\" cy=\"11\" r=\"8\"/>", "x": "<path d=\"M18 6 6 18\"/><path d=\"m6 6 12 12\"/>", "sun-moon": "<path d=\"M12 2v2\"/><path d=\"M14.837 16.385a6 6 0 1 1-7.223-7.222c.624-.147.97.66.715 1.248a4 4 0 0 0 5.26 5.259c.589-.255 1.396.09 1.248.715\"/><path d=\"M16 12a4 4 0 0 0-4-4\"/><path d=\"m19 5-1.256 1.256\"/><path d=\"M20 12h2\"/>"};
  function licon(n,s){return '<svg class="li" width="'+(s||14)+'" height="'+(s||14)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(LICONS[n]||'')+'</svg>';}

  // ---------- evidence + claims ----------
  // a claim is either a plain string, or {text, evidence}. evidence is a string, an array of
  // strings, or an array of {source, detail}. Everything traces to a Crustdata payload.
  function normClaim(x){return (x&&typeof x==='object'&&!Array.isArray(x))?{text:x.text!=null?x.text:'',evidence:x.evidence}:{text:x,evidence:null};}
  function evItems(ev){if(ev==null)return [];var a=Array.isArray(ev)?ev:[ev];return a.filter(function(x){return x!=null&&x!=='';});}
  function evPanel(ev){
    var items=evItems(ev);if(!items.length)return null;
    var panel=el('div','ev-panel');
    items.forEach(function(it){
      var d=el('div','ev-item');
      if(it&&typeof it==='object'){d.innerHTML=(it.source?('<span class="ev-src">'+esc(it.source)+'</span>'):'')+esc(it.detail||it.text||'');}
      else{d.textContent=String(it);}
      panel.appendChild(d);

    return panel;
  }
  function evButton(panel){
    var btn=el('button','ev-btn','▸ evidence');

    return btn;
  }
  // attach an evidence toggle (its own row) to a block container, e.g. under a paragraph
  function attachEvidence(container,ev){
    var panel=evPanel(ev);if(!panel)return;

    container.appendChild(row);container.appendChild(panel);
  }
  // an <li> for a claim, with inline evidence toggle when evidence is present
  function claimLI(x,cls){
    var c=normClaim(x);var li=el('li',cls||null);

      var head=el('div','claim-head');head.appendChild(el('span','claim-txt',esc(c.text)));
      head.appendChild(evButton(panel));li.appendChild(head);li.appendChild(panel);

    return li;
  }
  function claimList(arr,cls){var u=el('ul','ul'+(cls?(' '+cls):''));(arr||[]).forEach(function(x){u.appendChild(claimLI(x));});return u;}

  // ---------- header + stats ----------
  var acctLogoEl = document.getElementById('acctLogo');
  if(A.logo_url){

  } else { acctLogoEl.textContent = initials(A.name||'A'); }

  document.getElementById('stagePill').textContent = (META.deal_stage||'Research');
  document.getElementById('datePill').innerHTML = '<span class="dot"></span>'+esc(META.generated_at||'');

  var totalPosts=S.reduce(function(a,s){return a+(+s.posts_analyzed||0);},0);
  var warmN=(DOSSIER.warm_paths||[]).length;

  var econTotal=S.filter(function(s){return s.deal_role==='Economic Buyer';}).length;
  var statData=[
    ['Stakeholders mapped', S.length],
    ['LinkedIn posts analyzed', totalPosts.toLocaleString()],

  // ---------- tabs ----------
  var TABS=[['overview','Overview',null],['stakeholders','Stakeholders',S.length],['map','Relationship Map',null],
    ['signals','Signals',(DOSSIER.signals||[]).length],['plays','Plays',(DOSSIER.plays||[]).length]];
  var tabsEl=document.getElementById('tabs');
  TABS.forEach(function(t,i){
    var b=el('div','tab'+(i===0?' active':''),esc(t[1])+(t[2]?(' <span class="badge">'+t[2]+'</span>'):''));

  function pane(name){return document.querySelector('.tabpane[data-pane="'+name+'"]');}

  // ---------- overview ----------

    var p=pane('overview'); p.classList.add('section');

      var ic=el('div','chips');(A.investors||[]).forEach(function(x){ic.appendChild(el('span','chip',esc(x)));});invW.appendChild(ic);brief.appendChild(invW);}

      var cc=el('div','chips');(A.competitors||[]).forEach(function(x){cc.appendChild(el('span','chip',esc(x)));});cW.appendChild(cc);brief.appendChild(cW);}

        r.appendChild(tr);r.appendChild(el('div','cnt',esc(f.count)));hcard.appendChild(r);

    sigs.forEach(function(sg){
      var li=el('li');
      li.appendChild(el('div','when','<span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:'+(SEV[sg.severity]||'var(--low)')+';margin-right:6px"></span>'+esc(sg.date||'')));
      var tx=el('div');
      var kind=el('div','kind',(ICON[sg.type]?licon(ICON[sg.type],12)+' ':'')+esc((sg.type||'').replace(/_/g,' '))+(sg.severity?(' · '+esc(sg.severity)):''));
      tx.appendChild(kind);
      var who=sg.stakeholder_id&&byId[sg.stakeholder_id]?(' <span style="color:var(--ink-3)">— '+esc(byId[sg.stakeholder_id].name)+'</span>'):'';
      tx.appendChild(el('div','txt',esc(sg.text||'')+who));
      attachEvidence(tx, sg.evidence);
      li.appendChild(tx);ul.appendChild(li);
    });
    c.appendChild(ul);p.appendChild(c);
    var ws=DOSSIER.watchers||[];
    if(ws.length){
      var wc=el('div','card');wc.style.marginTop='16px';wc.appendChild(el('h3',null,'Watchers'));
      ws.forEach(function(w){var byId2={};S.forEach(function(s){byId2[s.id]=s;});var nm=(byId2[w.target]||{}).name||w.target||'account';
        wc.appendChild(el('div',null,'<div style="padding:7px 0;border-bottom:1px solid var(--line-2);font-size:13.5px"><span class="mini" style="color:'+(w.status==='active'?'var(--champ)':'var(--ink-3)')+'">'+esc(w.status||'suggested')+'</span> &nbsp;'+esc(w.type)+' → <b>'+esc(nm)+'</b>'+(w.note?(' <span style="color:var(--ink-3)">· '+esc(w.note)+'</span>'):'')+'</div>'));
      });p.appendChild(wc);
    }
  })();

  // ---------- plays ----------
  (function(){
    var p=pane('plays'); p.classList.add('section');
    var plays=(DOSSIER.plays||[]).slice();
    if(!plays.length){p.appendChild(el('div','empty','No plays generated.'));return;}
    var order={high:1,medium:2,low:3};plays.sort(function(a,b){return (order[a.priority]||9)-(order[b.priority]||9);});
    var PC={high:['var(--high)','var(--block-bg)'],medium:['var(--med)','var(--medium-bg)'],low:['var(--low)','var(--user-bg)']};
    var wrap=el('div','plays');
    plays.forEach(function(pl){
      var d=el('div','play');
      var pr=el('div','pri',esc(pl.priority||'')); var cc=PC[pl.priority]||PC.low;
      pr.setAttribute('style','color:'+cc[0]+';background:'+cc[1]);d.appendChild(pr);
      var body=el('div');
      body.appendChild(el('div','pt',esc(pl.title||'')));
      if(pl.why)body.appendChild(el('div','pw','Why: '+esc(pl.why)));
      if(pl.action)body.appendChild(el('div','pa',esc(pl.action)));
      attachEvidence(body, pl.evidence);
      d.appendChild(body);wrap.appendChild(d);
    });
    p.appendChild(wrap);
  })();

  // ---------- theme toggle ----------
  document.getElementById('themeBtn').onclick=function(){
    var r=document.documentElement;var cur=r.getAttribute('data-theme');
    var next=cur==='dark'?'light':cur==='light'?'dark':(matchMedia('(prefers-color-scheme:dark)').matches?'light':'dark');
    r.setAttribute('data-theme',next);
  };
}
})();
</script>
